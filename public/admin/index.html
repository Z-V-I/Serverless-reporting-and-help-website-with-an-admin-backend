<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0d0d0d"><title>教你举报 - 后台</title>
<link rel="icon" href="/logo.svg">
<style>
:root{--bg:#f5f5f7;--bg2:#fff;--bg3:#e8e8ed;--text:#1d1d1f;--text2:#86868b;--text3:#6e6e73;--accent:#c0392b;--green:#30d158;--warn:#f0ad4e;--border:rgba(0,0,0,.08);--radius:14px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
[data-theme="dark"]{--bg:#0d0d0d;--bg2:#1c1c1e;--bg3:#2c2c2e;--text:#f5f5f7;--text2:#98989d;--text3:#8e8e93;--border:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.hd{position:sticky;top:0;z-index:100;background:rgba(13,13,13,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
[data-theme] .hd{background:rgba(245,245,247,.72)}
[data-theme="dark"] .hd{background:rgba(13,13,13,.72)}
.hd-t{font-size:16px;font-weight:700;letter-spacing:-.01em}
.hd a{font-size:12px;padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--text2);text-decoration:none;transition:all .2s;font-weight:500}
.hd a:hover{border-color:var(--accent);color:var(--accent)}
.ibtn{padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;font-weight:500;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:all .2s}.ibtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}.tgl{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text)}
.tgl:active{transform:scale(.9)}
.ctn{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.ttl{font-size:clamp(18px,4vw,22px);font-weight:700;margin-bottom:12px;letter-spacing:-.015em}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;transition:all .3s}
.sn{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:-.02em;line-height:1.1}
.sl{font-size:11px;color:var(--text2);margin-top:3px}
.sg .sc:nth-child(3) .sn{color:var(--green)}.sg .sc:nth-child(4) .sn{color:var(--warn)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:all .3s}
.card h3{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.cr:last-child{border-bottom:none}.cr .l{color:var(--text2)}.cr .v{font-weight:600}
.hm365{display:flex;flex-wrap:wrap;gap:2px;padding:4px 0}.hc{width:10px;height:10px;border-radius:2px;background:var(--bg3)}.hc:hover{transform:scale(1.5)}.h1{background:rgba(192,57,43,.15)}.h2{background:rgba(192,57,43,.35)}.h3{background:rgba(192,57,43,.6)}.h4{background:rgba(192,57,43,.85)}
.bc{display:flex;align-items:flex-end;gap:3px;height:100px;padding-top:6px}.bar{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}.bar:hover{opacity:.7}
.bl{display:flex;gap:3px;padding-top:3px}.bl span{flex:1;font-size:9px;color:var(--text3);text-align:center}
.ps{height:12px;background:var(--bg3);border-radius:6px;overflow:hidden;display:flex;margin-top:4px}.ps .pe{background:var(--green);height:100%;transition:width .4s}.ps .pm{background:var(--warn);height:100%}
.lc{height:150px;padding:8px 0;position:relative}.lc svg{width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:12px}th{padding:7px 8px;background:var(--bg3);color:var(--text3);font-weight:600;text-align:left;font-size:10px;letter-spacing:.02em}td{padding:8px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top}
.tag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600}.te{background:rgba(48,209,88,.12);color:var(--green)}.tm{background:rgba(240,173,78,.15);color:var(--warn)}
.refresh-btn{display:inline-block;margin-left:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:18px;line-height:1;vertical-align:middle;transition:all .3s;font-family:var(--font)}.refresh-btn:hover{color:var(--accent);border-color:var(--accent);transform:rotate(180deg)}.pg{display:flex;gap:4px;justify-content:center;margin-top:10px;flex-wrap:wrap}.pg-btn{min-width:28px;height:28px;padding:0 7px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;font-size:11px;transition:all .2s}.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.pg-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}.pg-btn:disabled{opacity:.3;cursor:not-allowed}
.lg{max-width:360px;margin:80px auto;padding:28px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;text-align:center}
.lg h2{font-size:20px;margin-bottom:10px}.lg input{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;margin-bottom:10px}.lg .btn{display:block;width:100%;padding:11px;border:none;border-radius:18px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.pwd{display:inline-block;padding:4px 14px;background:var(--bg3);border-radius:10px;font-family:monospace;font-size:14px;letter-spacing:2px;margin:6px 0}.hid{display:none!important}
.fr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.fi{flex:1;min-width:100px}.fi select,.fi input{width:100%;padding:7px 8px;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;font-family:var(--font)}
footer{text-align:center;padding:20px 16px;color:var(--text3);font-size:11px}
@media(max-width:768px){.g2{grid-template-columns:1fr}.sg{grid-template-columns:repeat(2,1fr)}.sn{font-size:18px}}
</style></head><body>
<div class="hd"><span class="hd-t"> 后台管理</span><div style="display:flex;gap:6px;align-items:center"><a href="/">主站</a><button class="tgl" id="tb">&#9790;</button><button class="ibtn" onclick="logout()" style="border-color:var(--warn);color:var(--warn)">退出</button></div></div>
<div id="lv" class="lg"><h2>后台登录</h2>
<div id="ls1">
  <input type="email" id="lem" placeholder="管理员邮箱" autofocus><br>
  <input type="password" id="lps" placeholder="管理员密码"><br>
  <div id="lmaw"><span id="lmaq">加载中...</span><input type="number" id="lma" placeholder="计算题答案" style="width:100%"></div>
  <button class="btn" onclick="sendCode()">发送验证码</button>
  <p id="le" style="color:var(--accent);font-size:11px;margin-top:6px"></p>
</div>
<div id="ls2" class="hid">
  <p style="font-size:13px;color:var(--text2);margin-bottom:8px">验证码已发送到 <b id="lto"></b></p>
  <input type="text" id="lvc" placeholder="输入6位验证码" maxlength="6" autofocus><br>
  <button class="btn" onclick="verifyCode()">登录</button>
  <p style="font-size:11px;color:var(--text3);margin-top:6px"><a href="#" onclick="resetLogin()" style="color:var(--text3)">重新填</a></p>
  <p id="le2" style="color:var(--accent);font-size:11px;margin-top:6px"></p>
</div></div>
<div id="mv" class="ctn hid"><div class="ttl">数据后台 <button class="refresh-btn" onclick="la()" title="刷新数据">&circlearrowright;</button></div>
<div class="sg" id="sg"></div>
<div class="g2"><div class="card"><h3> 用户类型</h3><div id="us"></div></div><div class="card"><h3> 模式选择</h3><div id="ms"></div></div></div>
<div class="card"><h3> 365天访问热力图</h3><div class="hm365" id="hm"></div><div style="font-size:10px;color:var(--text3);text-align:right;margin-top:4px">浅 → 深</div></div>
<div class="card"><h3> 访问趋势（近30天）</h3><div id="vt" class="lc"></div></div>
<div class="g2"><div class="card"><h3>⏰ 时段分布（24h）</h3><div class="bc" id="hb"></div><div class="bl">'+<span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span><span>22</span><span>23</span>+'</div></div><div class="card"><h3> 举报类型占比</h3><div id="rb"></div></div></div>
<div class="g2"><div class="card"><h3> AI使用趋势（近30天）</h3><div id="at" class="lc"></div></div><div class="card"><h3> 热力提交趋势（近30天）</h3><div id="ht" class="lc"></div></div></div>
<div class="card"><h3> 反馈统计</h3><div id="fs"></div></div>
<div class="card"><h3> 举报数据列表</h3><div class="fr"><div class="fi"><select id="rt" onchange="lrl(1)"><option value="">全部类型</option><option value="education">教育</option><option value="municipal">政务</option></select></div><div class="fi"><input id="rp" placeholder="省份" onchange="lrl(1)"></div><div class="fi"><input type="date" id="rs" onchange="lrl(1)"></div><div class="fi"><input type="date" id="re" onchange="lrl(1)"></div></div><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>类型</th><th>地点</th><th>描述</th><th>时间</th></tr></thead><tbody id="rbd"></tbody></table></div><div class="pg" id="rpg"></div></div></div>
<footer>© Hamster zviman777@gmail.com · 后台管理</footer>
<script>
const Q=s=>document.querySelector(s),TK=localStorage.getItem('admin_token');let rp=1,trp=1,captchaHash='',sendEmail='';
async function loadCaptcha(){var r=await fetch('/api/admin/captcha');var d=await r.json();captchaHash=d.hash;Q('#lmaq').textContent=d.question;Q('#lma').value=''}
function it(){ith();Q('#tb').addEventListener('click',()=>{const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'':'dark');localStorage.setItem('theme',d?'light':'dark');utb()});if(TK)sm();else{sl();loadCaptcha()}}
function ith(){const s=localStorage.getItem('theme');if(s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.setAttribute('data-theme','dark')}utb()}
function utb(){const b=Q('#tb'),d=document.documentElement.getAttribute('data-theme')==='dark';b.innerHTML=d?'&#9728;':'&#9790;';document.querySelector('meta[name="theme-color"]').content=d?'#0d0d0d':'#f5f5f7'}
function sl(){Q('#lv').classList.remove('hid');Q('#mv').classList.add('hid');loadCaptcha()}
function sm(){Q('#lv').classList.add('hid');Q('#mv').classList.remove('hid');la()}
async function sendCode(){var e=Q('#lem').value.trim(),p=Q('#lps').value.trim(),a=Q('#lma').value.trim();if(!e||!p||!a){Q('#le').textContent='请完整填写所有字段';return}sendEmail=e;var r=await fetch('/api/admin/send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,captchaAnswer:parseInt(a),captchaHash:captchaHash})});var d=await r.json();if(r.ok){Q('#ls1').classList.add('hid');Q('#ls2').classList.remove('hid');Q('#lto').textContent=e;if(d.code){Q('#le2').textContent='请使用此验证码登录：'+d.code}Q('#lvc').focus()}else{Q('#le').textContent=d.error;loadCaptcha()}}
function resetLogin(){Q('#ls1').classList.remove('hid');Q('#ls2').classList.add('hid');loadCaptcha();Q('#le').textContent='';Q('#le2').textContent=''}
function logout(){localStorage.removeItem('admin_token');location.reload()}
async function verifyCode(){var c=Q('#lvc').value.trim();if(!c||c.length!==6){Q('#le2').textContent='请输入6位验证码';return}var r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:sendEmail,code:c})});if(r.ok){var d=await r.json();localStorage.setItem('admin_token',d.token);location.reload()}else{Q('#le2').textContent='验证码错误或已过期'}}
async function ap(p){const r=await fetch('/api/admin'+p,{headers:{'x-admin-token':TK}});if(r.status===401){localStorage.removeItem('admin_token');sl();return null}return r.json()}
async function la(){await Promise.all([ls(),lu(),lm(),lh(),lv(),lh2(),lr(),la2(),lh2t(),lf(),lrl(1)])}
async function ls(){const d=await ap('/stats');if(!d)return;Q('#sg').innerHTML='<div class="sc"><div class="sn">'+d.totalVisits+'</div><div class="sl">访问总数</div></div><div class="sc"><div class="sn">'+d.totalUsers+'</div><div class="sl">用户总数</div></div><div class="sc"><div class="sn">'+d.totalReports+'</div><div class="sl">举报总数</div></div><div class="sc"><div class="sn">'+d.aiUsers+'</div><div class="sl">AI使用人数</div></div><div class="sc"><div class="sn">'+d.totalAiUsage+'</div><div class="sl">AI使用次数</div></div><div class="sc"><div class="sn">'+d.todayVisits+'</div><div class="sl">今日访问</div></div><div class="sc"><div class="sn">'+d.totalFeedback+'</div><div class="sl">反馈总数</div></div><div class="sc"><div class="sn">'+d.totalLocations+'</div><div class="sl">举报地点</div></div>'}
async function lu(){const d=await ap('/user-type-stats');if(!d)return;const t=d.new+d.returning;Q('#us').innerHTML='<div class="cr"><span class="l">新用户</span><span class="v">'+d.new+'</span></div><div class="cr"><span class="l">回头客</span><span class="v">'+d.returning+'</span></div><div class="cr"><span class="l">新用户占比</span><span class="v">'+(t?(d.new/t*100).toFixed(1):0)+'%</span></div>'}
async function lm(){const d=await ap('/mode-stats');if(!d)return;const t=d.guided+d.free;Q('#ms').innerHTML='<div class="cr"><span class="l">一站式</span><span class="v">'+d.guided+'</span></div><div class="cr"><span class="l">自由模式</span><span class="v">'+d.free+'</span></div><div class="cr"><span class="l">一站式占比</span><span class="v">'+(t?(d.guided/t*100).toFixed(1):0)+'%</span></div>'}
async function lh(){const d=await ap('/visit-heatmap');if(!d)return;const m={};d.forEach(r=>{m[r.date]=r.count});const cs=[];const td=new Date();for(let i=364;i>=0;i--){const dt=new Date(td);dt.setDate(td.getDate()-i);const dd=dt.toISOString().slice(0,10);const c=m[dd]||0;let l='';if(c>0&&c<=2)l='h1';else if(c<=6)l='h2';else if(c<=15)l='h3';else if(c>15)l='h4';cs.push('<div class=\"hc '+l+'\"></div>')}Q('#hm').innerHTML=cs.join('');var hcs=Q('#hm').querySelectorAll('.hc');var ks=Object.keys(m);hcs.forEach(function(cell,i){var dt=new Date(td);dt.setDate(td.getDate()-364+i);var dd=dt.toISOString().slice(0,10);var ct=m[dd]||0;cell.addEventListener('mouseenter',function(){var tt=document.getElementById('heat-tip');if(!tt){tt=document.createElement('div');tt.id='heat-tip';tt.style.cssText='position:fixed;z-index:9999;background:rgba(28,28,30,.92);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;pointer-events:none';document.body.appendChild(tt)}tt.textContent=dd+': '+ct+' 次访问';tt.style.left=(cell.getBoundingClientRect().left-40)+'px';tt.style.top=(cell.getBoundingClientRect().bottom+4)+'px';tt.style.display='block'});cell.addEventListener('mouseleave',function(){var tt=document.getElementById('heat-tip');if(tt)tt.style.display='none'})})}
async function lv(){const d=await ap('/visit-trend?days=30');if(!d)return;dr('vt',d.map(r=>({x:r.date.slice(5),y:r.count})))}
async function lh2(){const d=await ap('/hour-distribution');if(!d)return;const m={};d.forEach(r=>{m[r.hour]=r.count});const mx=Math.max(...d.map(r=>r.count),1);const bs=[];for(let h=0;h<24;h++){const v=m[h]||0;bs.push('<div class=\"bar\" style=\"height:'+(v/mx*100).toFixed(1)+'%\" data-h=\"'+h+'\" data-v=\"'+v+'\"></div>')}Q('#hb').innerHTML=bs.join('');var tt=document.createElement('div');tt.id='bar-tip';tt.style.cssText='position:fixed;z-index:9999;background:rgba(28,28,30,.92);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;pointer-events:none;display:none';document.body.appendChild(tt);Q('#hb').querySelectorAll('.bar').forEach(function(b){b.addEventListener('mouseenter',function(){var t=document.getElementById('bar-tip');t.textContent=b.dataset.h+'时: '+b.dataset.v+' 次';t.style.display='block';t.style.left=(b.getBoundingClientRect().left-20)+'px';t.style.top=(b.getBoundingClientRect().top-28)+'px'});b.addEventListener('mouseleave',function(){document.getElementById('bar-tip').style.display='none'})})}
async function lr(){const d=await ap('/report-type-ratio');if(!d)return;const t=d.education+d.municipal;const ep=t?(d.education/t*100).toFixed(1):0;const mp=t?(d.municipal/t*100).toFixed(1):0;Q('#rb').innerHTML='<div class="cr"><span class="l"> 教育</span><span class="v">'+d.education+' ('+ep+'%)</span></div><div class="ps"><div class="pe" style="width:'+ep+'%"></div></div><div class="cr" style="margin-top:6px"><span class="l"> 政务</span><span class="v">'+d.municipal+' ('+mp+'%)</span></div><div class="ps"><div class="pm" style="width:'+mp+'%"></div></div>'}
async function la2(){const d=await ap('/ai-trend?days=30');if(!d)return;dr('at',d.map(r=>({x:r.date.slice(5),y:r.count})))}
async function lh2t(){const d=await ap('/heatmap-trend?days=30');if(!d)return;dr('ht',d.map(r=>({x:r.date.slice(5),y:r.count})))}
async function lf(){const d=await ap('/feedback-stats');if(!d)return;const t=d.total;Q('#fs').innerHTML=t?'<div class="cr"><span class="l"> 有帮助</span><span class="v" style="color:var(--green)">'+d.yes+'</span></div><div class="cr"><span class="l"> 没帮助</span><span class="v" style="color:var(--warn)">'+d.no+'</span></div><div class="cr"><span class="l">帮助率</span><span class="v">'+(d.yes/t*100).toFixed(1)+'%</span></div>':'<div style="color:var(--text3);font-size:12px;text-align:center;padding:8px">暂无反馈数据</div>'}
async function lrl(p){rp=p;const q=new URLSearchParams({page:p,limit:20});const t=Q('#rt').value,v=Q('#rp').value,s=Q('#rs').value,e=Q('#re').value;if(t)q.set('type',t);if(v)q.set('province',v);if(s)q.set('start_date',s);if(e)q.set('end_date',e);const d=await ap('/reports?'+q);if(!d)return;trp=d.totalPages;Q('#rbd').innerHTML=d.data.length?d.data.map(it=>'<tr><td style="font-size:10px;color:var(--text3)">#'+it.id+'</td><td>'+(it.report_type==='education'?'<span class="tag te">教育</span>':'<span class="tag tm">政务</span>')+'</td><td style="color:var(--text);font-weight:500">'+he(it.province)+' · '+he(it.city)+' · '+he(it.district)+'</td><td style="color:var(--text);line-height:1.5">'+he(it.description)+'</td><td style="font-size:10px;color:var(--text3);white-space:nowrap">'+fsd(it.created_at)+'</td></tr>').join(''):'<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text3)">暂无数据</td></tr>';const i=[];i.push('<button class="pg-btn" onclick="lrl('+(rp-1)+')" '+(rp<=1?'disabled':'')+'>‹</button>');const st=Math.max(1,rp-2),ed=Math.min(trp,st+4);for(let x=st;x<=ed;x++)i.push('<button class="pg-btn'+(x===rp?' active':'')+'" onclick="lrl('+x+')">'+x+'</button>');i.push('<button class="pg-btn" onclick="lrl('+(rp+1)+')" '+(rp>=trp?'disabled':'')+'>›</button>');Q('#rpg').innerHTML=i.join('')}
function dr(id,pts){const el=Q('#'+id);if(!pts.length){el.innerHTML='<div style="color:var(--text3);text-align:center;font-size:12px;padding:20px">暂无数据</div>';return}const W=el.clientWidth||560,H=150,P=16;const mx=Math.max(...pts.map(p=>p.y),1);const step=(W-P*2)/(pts.length-1||1);const cd=pts.map((p,i)=>[P+i*step,H-P-(p.y/mx)*(H-P*2)]);const ln=cd.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');const fl=ln+' L'+cd[cd.length-1][0].toFixed(1)+','+(H-P)+' L'+cd[0][0].toFixed(1)+','+(H-P)+' Z';const cs=getComputedStyle(document.documentElement);const c1=cs.getPropertyValue('--accent').trim(),c3=cs.getPropertyValue('--text3').trim();el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="'+c1+'" stop-opacity=".35"/><stop offset="100%" stop-color="'+c1+'" stop-opacity="0"/></linearGradient></defs><path d="'+fl+'" fill="url(#gf)"/><path d="'+ln+'" fill="none" stroke="'+c1+'" stroke-width="1.5"/><text x="'+P+'" y="'+(H-4)+'" font-size="9" fill="'+c3+'">'+pts[0].x+'</text><text x="'+(W-P)+'" y="'+(H-4)+'" font-size="9" fill="'+c3+'" text-anchor="end">'+pts[pts.length-1].x+'</text><text x="'+(W-P)+'" y="'+(P+8)+'" font-size="9" fill="'+c3+'" text-anchor="end">峰值 '+mx+'</text></svg>'}
function he(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}function fsd(s){return s?s.replace('T',' ').slice(0,16):''}
it();
</script></body></html>
