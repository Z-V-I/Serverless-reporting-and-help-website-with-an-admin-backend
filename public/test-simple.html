<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Simple Test</title><style>
body,html{margin:0;height:100%;background:#0d0d0d}
#m{width:100%;height:100vh}
#log{position:fixed;top:10px;left:10px;color:#fff;font-size:13px;z-index:9;background:rgba(0,0,0,.7);padding:10px;border-radius:6px;max-width:90vw;word-break:break-all}
</style></head><body>
<div id="log">启动...</div><div id="m"></div>
<script>
var L=document.getElementById('log');
function log(s){L.textContent+='\n'+s;console.log(s)}

log('开始加载ECharts...');
var s=document.createElement('script');
s.src='/lib/echarts.min.js';
s.onload=function(){
  log('ECharts OK');
  log('加载GeoJSON...');
  fetch('/china-geo.json').then(function(r){return r.json()}).then(function(g){
    log('GeoJSON OK: '+(g.features?g.features.length:'?')+' features');
    echarts.registerMap('china',g);
    log('初始化地图...');
    var c=echarts.init(document.getElementById('m'));
    if(!c){log('FAIL: echarts.init返回null');return}
    log('设置数据...');
    c.setOption({
      geo:{map:'china',roam:true,label:{show:false},itemStyle:{areaColor:'#2c2c2e',borderColor:'#555'},emphasis:{label:{show:true}}},
      series:[]
    });
    log('渲染完成！');
  }).catch(function(e){log('GeoJSON FAIL: '+e.message)});
};
s.onerror=function(){log('ECharts加载失败!')};
document.head.appendChild(s);
</script></body></html>
