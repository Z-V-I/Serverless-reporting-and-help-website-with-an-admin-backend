<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Map Test</title>
<style>body{margin:0;background:#000}#m{width:100vw;height:100vh}</style></head><body>
<div id="m"></div>
<script>
async function test() {
  // 1. Load ECharts
  await new Promise((r, x) => { const s = document.createElement('script'); s.src = '/lib/echarts.min.js'; s.onload = r; s.onerror = x; document.head.appendChild(s) });
  console.log('ECharts loaded:', !!window.echarts);
  // 2. Load GeoJSON
  const geo = await (await fetch('/china-geo.json')).json();
  echarts.registerMap('china', geo);
  console.log('GeoJSON registered:', !!geo.features);
  // 3. Init chart
  const ch = echarts.init(document.getElementById('m'));
  console.log('Chart inited:', !!ch);
  // 4. Set data
  const r = await fetch('/api/public/points');
  const pts = await r.json();
  console.log('Points:', JSON.stringify(pts));
  // 5. Render
  ch.setOption({
    geo: { map: 'china', roam: true, label: { show: false }, itemStyle: { areaColor: '#2c2c2e', borderColor: '#444' } },
    series: [{ type: 'effectScatter', coordinateSystem: 'geo', data: pts.filter(p => p.city === '杭州市').map(p => ({ name: p.city, value: [120.155, 30.274, p.count] })), symbolSize: v => 20, itemStyle: { color: '#c0392b' } }]
  });
  console.log('Render done.');
}
test().catch(e => console.error('FAIL:', e.message, e.stack));
</script></body></html>
